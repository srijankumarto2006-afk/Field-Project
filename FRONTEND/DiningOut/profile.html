<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srijankumar - Zomato Profile Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./profile.css">
    
   
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <img src="./logo.png" alt="logo" class="pic">
            <div class="search-container">
                <div class="location-picker">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Guntur</span>
                    <i class="fa-solid fa-caret-down" style="margin-left: auto; color: #1c1c1c;"></i>
                </div>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search for restaurant, cuisine or a dish">
                </div>
            </div>
        </div>
        
        <div class="nav-right" id="navProfileTrigger">
            <div class="login Box btn hidden" id="loginBox">
                <button class="button open-btn" id="login">Login</button>
            </div>
            <div class="signup Box btn hidden" id="signupBox">
                <button class="button" id="sign">Sign up</button>
            </div>

            <div class="user-profile" id="userBox">
                <img src="https://b.zmtcdn.com/web/assets/2267aec184e096c98c46a1565a5563661664945464.png?fit=around%7C100%3A100&crop=100%3A100%3B%2A%2C%2A" alt="User" class="user-icon">
                <span id="welcomeUser">Srijankumar</span>
                <span class="arrow">&#9662;</span>
            </div>

            <div class="profile-menu" id="profileMenu">
                <p>Profile</p>
                <p>Reviews</p>
                <p>Settings</p>
                <hr>
                <p id="logoutBtn">Log out</p>
            </div>
        </div>
    </nav>

    <header class="profile-header">
        <div class="header-content">
            <div class="user-info">
                <div class="avatar-container">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h1 class="user-name">Srijankumar</h1>
            </div>
            <div class="header-stats-action">
                <button class="edit-profile-btn">
                    <i class="fa-regular fa-pen-to-square"></i> Edit profile
                </button>
                <div class="stats-container">
                    <div class="stat-item">
                        <span id="count-reviews">0</span>
                        <label>Reviews</label>
                    </div>
                    <div class="stat-item">
                        <span id="count-photos">0</span>
                        <label>Photos</label>
                    </div>
                    <div class="stat-item">
                        <span id="count-followers">0</span>
                        <label>Followers</label>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3 class="sidebar-title">Activity</h3>
                <ul class="sidebar-menu">
                    <li class="menu-item active" onclick="switchTab(this, 'Reviews')">Reviews</li>
                    <li class="menu-item" onclick="switchTab(this, 'Photos')">Photos</li>
                    <li class="menu-item" onclick="switchTab(this, 'Followers')">Followers</li>
                    <li class="menu-item" onclick="switchTab(this, 'Recently Viewed')">Recently Viewed</li>
                </ul>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-title">Online Ordering</h3>
                <ul class="sidebar-menu">
                    <li class="menu-item" onclick="switchTab(this, 'My addresses')">My addresses</li>
                </ul>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-title">Payments</h3>
                <ul class="sidebar-menu">
                    <li class="menu-item" onclick="switchTab(this, 'Manage Cards')">Manage Cards</li>
                </ul>
            </div>
        </aside>

        <section class="content-area">
            <h2 class="content-title" id="dynamic-title">Reviews</h2>
            
            <div class="empty-state">
                <div class="empty-illustration">
                    <div class="circle-bg"></div>
                    <div class="coffee-cup"></div>
                    <div class="pencil"></div>
                    <div class="paper-doc"></div>
                    <div class="paper-doc-front">
                        <div class="star-badge"><i class="fa-solid fa-star"></i></div>
                        <div class="doc-line" style="width: 80%"></div>
                        <div class="doc-line" style="width: 60%"></div>
                    </div>
                </div>
                <p class="empty-text">Nothing here yet</p>
            </div>
        </section>
    </main>

    
       <script>
        // --- 1. Dynamic Profile Name Syncing & Access Control ---
       // --- 1. Dynamic Profile Name Syncing & Access Control ---
        document.addEventListener("DOMContentLoaded", function() {
            const userData = localStorage.getItem("user");

            if (userData) {
                try {
                    const user = JSON.parse(userData);
                    
                    const welcomeUser = document.getElementById('welcomeUser');
                    if (welcomeUser) welcomeUser.textContent = user.name;

                    const mainUserNameElement = document.querySelector('.user-name');
                    if (mainUserNameElement) mainUserNameElement.textContent = user.name;
                    
                    document.title = `${user.name} - Zomato Profile Clone`;
                } catch (e) {
                    console.error("Error parsing user data from localStorage:", e);
                }
            } else {
                alert("Please log in first!");
                // 🚀 If authorization fails, send them back to the DiningOut homepage safely
                window.location.href = "/FRONTEND/DiningOut/newindex.html";
            }
        });

        // --- 2. Tab Switching Logic ---
        function switchTab(element, tabName) {
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');
            
            const dynamicTitle = document.getElementById('dynamic-title');
            if (dynamicTitle) {
                dynamicTitle.innerText = tabName;
            }
        }

        // --- 3. Dropdown Menu Toggle Logic ---
        const navProfileTrigger = document.getElementById('navProfileTrigger');
        const profileMenu = document.getElementById('profileMenu');

        if (navProfileTrigger && profileMenu) {
            // Toggle dropdown display state when user clicks profile block
            navProfileTrigger.addEventListener('click', function(event) {
                event.stopPropagation(); // Stops instant close trigger from window listener below
                
                if (profileMenu.classList.contains('show') || profileMenu.style.display === "block") {
                    profileMenu.classList.remove('show');
                    profileMenu.style.display = "none";
                } else {
                    profileMenu.classList.add('show');
                    profileMenu.style.display = "block";
                }
            });

            // Close dropdown container instantly if user clicks anywhere else on screen
            window.addEventListener('click', function() {
                profileMenu.classList.remove('show');
                profileMenu.style.display = "none";
            });
        }

        // --- 4. Logout Action Processor ---
        const logoutBtn = document.getElementById('logoutBtn');

        if (logoutBtn) {
            logoutBtn.addEventListener('click', function(event) {
                event.stopPropagation(); // Clear event bubble space
                
                // Clear authorization tokens
                localStorage.removeItem("token");
                localStorage.removeItem("user");
                
                // Step back out of Delivery folder, straight into DiningOut/newindex.html
                window.location.href = '../DiningOut/newindex.html'; 
            });
        } else {
            // Fallback warning log if the logout button element is missing from the DOM
            console.warn("⚠️ Warning: Could not find 'logoutBtn' element in the HTML layout.");
        }
    </script>
</body>
</html>
