<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Orient Pearl - Ultra-Large Menu</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    <style>
        :root {
            --bg-main: #f4f4f4; 
            --bar-bg: #333333;
            --header-h: 50px;
            --footer-h: 55px;
        }

        body {
           margin: 0;
            background-color: var(--bg-main);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            height: var(--header-h);
            background: var(--bar-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            z-index: 10;
        }

       .logo { color: white; font-weight: 700; letter-spacing: 2px; font-size: 14px; }
        
        .search-box {
            background: #444;
            border: none;
            padding: 6px 15px;
            border-radius: 2px;
            color: white;
            width: 220px;
            font-size: 13px;
        }

        /* --- MAXIMIZED CONTAINER --- */
        #container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Reduced padding from 20px to 5px to give the book more room */
            padding: 5px; 
            
            perspective: 3500px;
          background: radial-gradient(circle, #ffffff 0%, #ffffff 100%);
            width: 100vw;
        }

        .book-wrapper {
            position: relative;
            /* Deeper shadow for a large-scale object */
            box-shadow: 0 60px 180px rgba(0,0,0,0.15); 
        }

        .page {
            background-color: white;
            overflow: hidden;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: fill; 
            display: block;
        }

        footer {
            height: 60px;
            background: var(--bar-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            color: #999;
            z-index: 10;
            border-top: 1px solid #222;
        }

        .nav-btn {
            background: none;
            border: 1px solid #444;
            color: white;
            font-size: 16px;
            cursor: pointer;
            padding: 8px 25px;
            border-radius: 4px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-btn:hover { background: #333; border-color: #666; }
    </style>
</head>
<body>

    <header>
        <div class="logo">HOTEL ORIENT PEARL</div>
        <input type="text" class="search-box" placeholder="Search menu...">
    </header>

    <div id="container">
        <div class="book-wrapper">
            <div id="book">
                <div class="page" data-density="hard"><img src="https://img.sanishtech.com/u/4801caf23e2bd70ffe5de0ac81786196.png"></div>
                <div class="page"><img src="https://img.sanishtech.com/u/3c2efc9750fe698b4590422c4735ab1a.png"></div>
                <div class="page"><img src="https://img.sanishtech.com/u/feba7456c14b3dd934617b4f669965d6.png"></div>
                <div class="page"><img src="https://img.sanishtech.com/u/ee38c3c3ebc0a00e88cfe849f4ead92a.png"></div>
                <div class="page"><img src="https://img.sanishtech.com/u/3d4e413db4effe9d2b9f3864a61f1459.png"></div>
                <div class="page"><img src="https://img.sanishtech.com/u/78cd2ed0e6d1d72b146c5e3ed4ccdee3.png"></div>
                <div class="page"><img src="https://img.sanishtech.com/u/f6008e8ce115913321a4a145e4d9ab84.png"></div>
                <div class="page"><img src="https://img.sanishtech.com/u/ea682a3e4d40a12e731aa9c61262b298.png"></div>
                <div class="page"><img src="https://img.sanishtech.com/u/d231d073a0545123ee4804cbe80fc02a.png"></div>
                <div class="page"><img src="https://img.sanishtech.com/u/66c25cd929cf74d48595413ee6e4a8b2.png"></div>
                <div class="page"><img src="https://img.sanishtech.com/u/009e769125ba20247ed7082cd0e6fc17.png"></div>
                 <div class="page"><img src="https://img.sanishtech.com/u/c36fad828bd961a77e778fb6393abcca.png"></div>
                  <div class="page"><img src="https://img.sanishtech.com/u/7a73a242fa9fc43f2301aee50b841367.png"></div>
                  <div class="page"><img src="https://img.sanishtech.com/u/7a3bc07bc35d8d2518efc6da3fd2e4d4.png"></div>
                  <div class="page"><img src="https://img.sanishtech.com/u/fe076a153003ed81e8ca28b91aefe840.png"></div>
                  <div class="page"><img src="https://img.sanishtech.com/u/2f1abc5fb8367b4d05db72417f487e0c.png"></div>
                  <div class="page"><img src="https://img.sanishtech.com/u/e8efbdc59602becb2b4a3913bab8ddf1.png"></div>
                  <div class="page"><img src="https://img.sanishtech.com/u/da10aa6b8ae013f35f0e6ff1577350d7.png"></div>
                  <div class="page"><img src="https://img.sanishtech.com/u/128cc65dc91918920f12595659d313ff.png"></div>
                  <div class="page"><img src="https://img.sanishtech.com/u/b9048fc768dfc386e106ae5f1f47bc6a.png"></div>
                  <div class="page"><img src="https://img.sanishtech.com/u/689a2386de64add74f895eba7ba631c3.png"></div>
                  <div class="page"><img src="https://img.sanishtech.com/u/15df97ec0a0d4c0d2f95aba296d5dc83.png"></div>
                   <div class="page"><img src="https://img.sanishtech.com/u/2b405b6fa234a87d80619cf6127aaa8a.png"></div>
                 
                  
                
               
                <div class="page" data-density="hard"><img src="https://img.sanishtech.com/u/c5af296b3455f4d17cb58a3bff147cdb.png"></div>
            </div>
        </div>
    </div>

    <footer>
        <button class="nav-btn" id="prev">PREVIOUS</button>
        <div id="page-num" style="min-width: 130px; text-align: center; letter-spacing: 1px;">1 / 12</div>
        <button class="nav-btn" id="next">NEXT</button>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pageFlip = new St.PageFlip(document.getElementById('book'), {
                // INCREASED BASE SCALE
                width: 680, 
                height: 1020,
                
                size: "stretch", 
                minWidth: 400, 
                // Increased maxWidth and maxHeight to allow full-screen takeover
                maxWidth: 2200, 
                minHeight: 600, 
                maxHeight: 2800,
                
                maxShadowOpacity: 0.8, 
                showCover: true,
                usePortrait: false, 
                flippingTime: 1100, 
                drawShadow: true,
                mobileScrollSupport: false
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            document.getElementById('prev').addEventListener('click', () => pageFlip.flipPrev());
            document.getElementById('next').addEventListener('click', () => pageFlip.flipNext());

            pageFlip.on('flip', (e) => {
                const total = pageFlip.getPageCount();
                const current = e.data + 1;
                
                if (current === 1 || current === total) {
                    document.getElementById('page-num').innerText = current + " / " + total;
                } else {
                    document.getElementById('page-num').innerText = current + "-" + (current + 1) + " / " + total;
                }
            });
        });
    </script>
</body>
</html>
