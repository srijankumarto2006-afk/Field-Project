<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="overlaysign hidden" id="over">

    <div class="signup-box">

        <div class="signup-header">
            <h2>Sign up</h2>
            <span class="close" onclick="closeSignup()">✕</span>
        </div>

        <input type="text" placeholder="Full Name" class="input-box">
        <input type="email" placeholder="Email" class="input-box">

        <div class="terms">
            <input type="checkbox" class="check">
            <p>I agree to Hotel Orient Peral's 
            <span>Terms of Service</span>, 
            <span>Privacy Policy</span> and 
            <span>Content Policies</span>
            </p>
        </div>

        <button class="create-btn" >Create account</button>

        <div class="divider">or</div>

        <button class="google-btn" onclick="googleLogin()">
    <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" width="20px">
    Sign in with Google
</button>

        <div class="login-text">
            Already have an account? <span onclick="openLogin()">Log in</span>
        </div>

    </div>



</div>

    
</body>
</html>
